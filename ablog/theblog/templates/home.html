{%extends 'base.html'%} {%block title%} My Blog {%endblock%} {%block content%}
<div class="container mt-5">
  <h1 class="fw-bold mb-4">Post</h1>

  <div class="row">
    {% for post in object_list %}
    <div class="col-md-6 col-lg-4 mb-4">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <div class="mb-2">
            <a
              href="{% url 'categorys' post.category|slugify %}"
              class="badge bg-primary text-white"
            >
              {{ post.category }}
            </a>
            <small class="text-muted ms-2">{{ post.post_date }}</small>
          </div>

          <h5 class="card-title">
            <a
              href="{% url 'blog-article' post.pk %}"
              class="text-dark text-decoration-none"
            >
              {{ post.title }}
            </a>
          </h5>

          <p class="card-text text-muted">
            {{ post.snippet|truncatewords:15 }}
          </p>

          <a
            href="{% url 'blog-article' post.pk %}"
            class="btn btn-outline-primary btn-sm"
          >
            Read More
          </a>
        </div>
      </div>
    </div>
    {%empty%}
    <p>No posts available.</p>
    {%endfor%}
  </div>
</div>
{%endblock%}

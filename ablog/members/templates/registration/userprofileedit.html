{%extends 'base.html'%}



{%block content%}
{%if user.is_authenticated %}
{%if user.id == profile.bloguser.id%}
<h1>Edit Profile</h1>
<div class='container'>
<div class='form-group'>
<form method='POST' enctype='multipart/form-data'>
    {% csrf_token %}
    {{form.media}}
    {{form.as_p}}
    <button  class="btn btn-success">Update Profile</button>
    <a href='{% url 'home'%}' type="button" class="btn btn-dark" >Back<a>
</div>
</div>
{%endif%}
{%endif%}


{%endblock%}

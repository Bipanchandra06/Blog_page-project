{%extends 'base.html'%}



{%block content%}
{%if user.is_authenticated%}
{%if user.id == post.author.id%}
<h1>Edit Your Post</h1>
<div class='container'>
<div class='form-group'>
<form method='POST'>
    {% csrf_token %}
    {{form.media}}
    {{form.as_p}}
    <button  class="btn btn-success">Post</button>
    <a href='{% url 'blog-article' post.pk %}' type="button" class="btn btn-dark" >Back<a>
</div>
</div>
{%endif%}
{%endif%}
{%endblock%}

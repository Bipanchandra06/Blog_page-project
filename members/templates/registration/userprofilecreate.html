{%extends 'base.html'%}



{%block content%}
{%if user.is_authenticated %}
<h1>Create Your Profile</h1>
<div class='container'>
<div class='form-group'>
<form method='POST' enctype='multipart/form-data'>
    {% csrf_token %}
    {{form.media}}
    {{form.as_p}}
    <button  class="btn btn-success">Create</button>
</div>
</div>
{%endif%}
{%endblock%}

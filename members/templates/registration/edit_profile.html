{%extends 'base.html'%}



{%block content%}
{%if user.is_authenticated%}
<h1>Update Settings</h1>
<div class='container'>
<div class='form-group'>
<form method='POST'>
    {% csrf_token %}
    {{form.as_p}}
    <button  class="btn btn-success">Update</button><br/>
    <br><br/>
    <a href='{%url 'password'%}' class='btn btn-success'>Change Password</a>
</div>
</div>
{%endif%}
{%endblock%}
